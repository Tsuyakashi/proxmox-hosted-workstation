# /etc/default/gpu-arbiter on bare-pve — sourced by gpu-arbiter.sh + workstation.sh
# Verified 2026-11-16 (lspci -nn, /sys/bus/pci/devices/*/iommu_group).
# group 1: GTX 1660 SUPER — 01:00.0 VGA, .1 HDMI audio, .2 USB-C xHCI, .3 UCSI
GPU_VGA=0000:01:00.0
GPU_AUD=0000:01:00.1
GPU_EXTRA="0000:01:00.2 0000:01:00.3"
# Intel 8-series: xHCI (group 2), EHCI #1 (8), EHCI #2 (4), HD Audio (5).
# SATA (group 9, PVE boot disk) and the Realtek NIC stay with the host.
USB_FUNCS="0000:00:14.0 0000:00:1d.0 0000:00:1a.0 0000:00:1b.0"

# Shared game disks = the Windows VM's sata1 (local-lvm, SSD) and sata2
# (hdd, sdb). NTFS volumes labelled as below; mounted for the Ubuntu CT.
SHARED_DISK_SLOTS="sata1 sata2"
SHARED_LABELS="games-ssd games-hdd"
SHARED_MNT_ROOT=/mnt/shared
# Desktop user in the CT (first user created by lxc-ubuntu-desktop-provision.sh).
SHARED_UID=1000
SHARED_GID=1000
